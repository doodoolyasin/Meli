name: Build All

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  JAVA_VERSION: '21'
  OPENSSL_VERSION: '3.0.15'

jobs:
  # Job 1: Build Go Core Binaries (Linux, Windows, macOS, ARM64)
  build-go:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        # `go mod tidy` rewrites go.mod/go.sum inside CI, so a build could
        # "fix" a broken dependency graph instead of failing on it.
        run: |
          go mod download
          go mod verify

      - name: Build client
        run: |
          mkdir -p dist
          ext="${{ matrix.goos == 'windows' && '.exe' || '' }}"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/AryanaNG-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" ./cmd/client
          cp "dist/AryanaNG-${{ matrix.goos }}-${{ matrix.goarch }}${ext}" "dist/meli-client-${{ matrix.goos }}-${{ matrix.goarch }}${ext}"

      - name: Build server
        run: |
          mkdir -p dist
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/meli-server-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/server
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/meli-demux-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/demux

      - name: Build dnstt-server
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          git clone --depth 1 https://github.com/anonvector/dnstt.git /tmp/dnstt-build
          cd /tmp/dnstt-build/dnstt-server
          CGO_ENABLED=0 go build -ldflags="-s -w" -o $GITHUB_WORKSPACE/dist/dnstt-server-linux-amd64 .

      - name: Publish Binaries to Release
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l dist/
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "Meli v1.0.0" --notes "Automated build from $GITHUB_SHA"
          gh release upload v1.0.0 dist/* --clobber

  # Job 2: Build Android Multi-Engine APK (Full & Lite)
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # External tunnel sources (noizdns, vaydns, vaydns-mobile, dnstt,
      # slipstream-rust, slipstream-rust-plus) are vendored inside this
      # repository, so nothing is cloned from third-party accounts here.
      # Upstream commits can be brought in intentionally via the vendored
      # directories themselves.

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'jetbrains'

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install Rust & cargo-ndk
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --locked

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ~/android-openssl
          key: openssl-android-${{ env.OPENSSL_VERSION }}

      - name: Build OpenSSL for Android
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          cd android
          chmod +x app/scripts/build-openssl-android.sh
          OUTPUT_DIR=$HOME/android-openssl/android-ssl \
          OPENSSL_VERSION=${{ env.OPENSSL_VERSION }} \
          ./app/scripts/build-openssl-android.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Install gomobile
        run: go install golang.org/x/mobile/cmd/gomobile@latest && gomobile init

      - name: Build Go mobile libraries
        working-directory: android/gomobile-build
        run: make build

      - name: Build sing-box core (OpenVPN, TUIC, AnyTLS, ShadowTLS, Hysteria)
        run: |
          git clone --depth 1 https://github.com/SagerNet/sing-box.git "$RUNNER_TEMP/sb"
          cd "$RUNNER_TEMP/sb"
          TC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$TC/aarch64-linux-android21-clang" GOFLAGS=-mod=mod \
            go build -trimpath -tags "with_quic,with_utls,with_openvpn,badlinkname,tfogo_checklinkname0" \
            -ldflags "-s -w -checklinkname=0 -buildid=" -o "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so" ./cmd/sing-box
          ls -l "$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a/libsingbox.so"

      - name: Build AmneziaWG and Psiphon cores
        run: |
          D="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/arm64-v8a"
          git clone https://github.com/amnezia-vpn/amneziawg-go.git "$RUNNER_TEMP/awg"
          cd "$RUNNER_TEMP/awg" && git checkout b5928efb6ca19f0153958460c3d141f04abc5c2e
          mkdir -p cmd/awgsocks && cp "$GITHUB_WORKSPACE/android/awgcore/main.go" cmd/awgsocks/main.go
          GOFLAGS=-mod=mod go get gvisor.dev/gvisor@go
          GOFLAGS=-mod=mod CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$D/libawg.so" ./cmd/awgsocks
          git clone https://github.com/Psiphon-Labs/psiphon-tunnel-core.git "$RUNNER_TEMP/psi"
          cd "$RUNNER_TEMP/psi" && git checkout fc35a75
          CGO_ENABLED=0 GOFLAGS=-mod=vendor GOOS=android GOARCH=arm64 go build -trimpath -ldflags "-s -w -checklinkname=0" -o "$D/libpsiphon.so" ./ConsoleClient
          ls -l "$D"

      - name: Setup Keystore
        working-directory: android
        run: |
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          if [ -z "$STORE_PASS" ]; then
            STORE_PASS="slipnet123456"
          fi
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          if [ -z "$KEY_PASS" ]; then
            KEY_PASS="$STORE_PASS"
          fi
          B64_KEY="${{ secrets.RELEASE_KEYSTORE_BASE64 }}"
          if [ -n "$B64_KEY" ]; then
            echo "$B64_KEY" | base64 -d > slipnet-release.keystore
          elif [ ! -f slipnet-release.keystore ]; then
            keytool -genkeypair -v -keystore slipnet-release.keystore -alias slipnet -keyalg RSA -keysize 2048 -validity 10000 -storepass "$STORE_PASS" -keypass "$KEY_PASS" -dname "CN=AryanaNG, OU=Aryana, O=Aryana, L=Tehran, S=Tehran, C=IR"
          fi
          cat > keystore.properties <<EOF
          storeFile=../slipnet-release.keystore
          storePassword=$STORE_PASS
          keyAlias=slipnet
          keyPassword=$KEY_PASS
          EOF
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./android/gradlew

      - name: Warm up Gradle wrapper (retry on download errors)
        working-directory: android
        run: |
          for i in 1 2 3 4 5 6; do
            ./gradlew --version && exit 0
            echo "gradle download failed, retry $i"; sleep $((i*20))
          done
          exit 1

      - name: Build Full Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleFullRelease --no-daemon --stacktrace

      - name: Build Lite Release APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx5g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g"
        run: ./gradlew assembleLiteRelease --no-daemon

      - name: Collect release APKs
        working-directory: android
        run: |
          mkdir -p release-apks
          shopt -s nullglob
          apks=(app/build/outputs/apk/*/release/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::Gradle reported success but produced no release APK"
            find app/build/outputs -maxdepth 4 -name '*.apk' -print || true
            exit 1
          fi
          cp "${apks[@]}" release-apks/
          ls -l release-apks/

      - name: Publish APKs directly to Release
        working-directory: android
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 >/dev/null 2>&1 || gh release create v1.0.0 --title "Meli v1.0.0" --notes "Automated build from $GITHUB_SHA"
          gh release upload v1.0.0 release-apks/*.apk --clobber
