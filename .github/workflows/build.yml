name: Build Meli

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
    - name: Build
      run: |
        go mod tidy
        go build -v -o meli-server ./cmd/server
        go build -v -o meli-client ./cmd/client 2>/dev/null || echo "client not yet implemented"
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: meli-binaries
        path: |
          meli-server
          meli-client
